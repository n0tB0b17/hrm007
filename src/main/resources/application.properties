# server configuration
spring.application.name=hrm007
server.port=6969

# neo4j configuration
spring.neo4j.url=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password123

# jwt configuration
app.jwt.secret=dev-test-secret-key-sush-dont-tell-anyone
app.jwt.expiration-ms=3600000

# devtools configuration
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.restart.exclude=static/**,public/**,templates/**,**/*Test.class,**/*Tests.class
spring.devtools.restart.trigger-file=.reloadtrigger
# spring.devtools.restart.additional-paths=src/main/java,src/main/resources


logging.level.org.springframework.data.neo4j.cypher.deprecation=ERROR